name: Build iOS DEB packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          brew install ldid dpkg make
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build camera
        run: bash camera/HorizonCamera/scripts/package-deb.sh rootful
      - name: Build motion blur and preferences
        env:
          THEOS: ${{ runner.temp }}/theos
        run: gmake -C ios26/HorizonMotion FINALPACKAGE=1 package
      - name: Inspect packages
        run: |
          mkdir -p artifacts/camera artifacts/ios26 artifacts/utility artifacts/icons artifacts/wallpapers
          cp camera/HorizonCamera/packages/*.deb artifacts/camera/
          cp ios26/HorizonMotion/packages/*.deb artifacts/ios26/
          for package in artifacts/camera/*.deb artifacts/ios26/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ios-deb-packages
          path: artifacts/
          retention-days: 14
  repository:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-deb-packages
          path: repo
      - name: Create APT index
        run: python3 scripts/make-repo.py repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - uses: actions/deploy-pages@v4
        id: deployment
