name: Build iOS DEB packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          brew install ldid dpkg make
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Build camera
        run: bash camera/HorizonCamera/scripts/package-deb.sh rootful
      - name: Check stabilization crop geometry
        run: |
          swiftc camera/HorizonCamera/Sources/HorizonMath.swift scripts/HorizonGeometryChecks.swift -o "$RUNNER_TEMP/horizon-checks"
          "$RUNNER_TEMP/horizon-checks"
      - name: Build motion blur and preferences
        env:
          THEOS: ${{ runner.temp }}/theos
        run: gmake -C ios26/HorizonMotion FINALPACKAGE=1 package
      - name: Build dock and preferences
        env:
          THEOS: ${{ runner.temp }}/theos
        run: gmake -C ios26/NuloraDock FINALPACKAGE=1 package
      - name: Inspect packages
        run: |
          mkdir -p artifacts/camera artifacts/ios26 artifacts/motion-blur artifacts/utility artifacts/icons artifacts/wallpapers
          cp camera/HorizonCamera/packages/*.deb artifacts/camera/
          cp ios26/HorizonMotion/packages/*.deb artifacts/ios26/
          cp ios26/HorizonMotion/packages/*.deb artifacts/motion-blur/
          cp ios26/NuloraDock/packages/*.deb artifacts/utility/
          cp icons/nulora-*.png artifacts/icons/
          for package in artifacts/camera/*.deb artifacts/motion-blur/*.deb artifacts/utility/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ios-deb-packages
          path: artifacts/
          retention-days: 14
      - name: Publish direct download mirrors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 >/dev/null 2>&1 || gh release create v0.2.0 --title 'Nulora 0.2.0' --notes-file RELEASE-NOTES.md
          gh release upload v0.2.0 artifacts/camera/*.deb artifacts/motion-blur/*.deb artifacts/utility/*.deb --clobber
  repository:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-deb-packages
          path: repo
      - name: Create APT index
        run: python3 scripts/make-repo.py repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - uses: actions/deploy-pages@v4
        id: deployment
